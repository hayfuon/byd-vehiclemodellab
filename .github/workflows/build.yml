name: 源码构建验证
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            for candidate in "$sdk_root"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                sdkmanager="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$sdk_root" || ! -x "$sdkmanager" ]]; then
            echo "::error::Android SDK Command Line Tools 未找到" >&2
            exit 1
          fi
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"
          "$sdkmanager" --sdk_root="$sdk_root" --version
          "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: 构建与测试
        run: ./gradlew :vehicle-core:testDebugUnitTest :vehicle-core:assembleRelease :renderer:assembleRelease :renderer:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:publishRelease
      - uses: actions/upload-artifact@v6
        with:
          name: BYD-VehicleModelLab-release-unsigned
          path: |
            build/release/*
            build/vehicle-core/outputs/aar/*-release.aar
            build/renderer/outputs/aar/*-release.aar
          if-no-files-found: error
